      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root">
      <div
        data-boot-placeholder="1"
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:sans-serif;background:#f1f5f9;color:#1e3a5f;font-size:14px;padding:16px;text-align:center;"
      >
        <div>Chargement de ProjectController…</div>
      </div>
    </div>
    <script>
      (function () {
        function showBootRecovery(title, detail) {
          var placeholder = document.querySelector('#root [data-boot-placeholder]');
          if (!placeholder) return;
          placeholder.innerHTML =
            '<div style="max-width:420px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:20px;box-shadow:0 4px 16px rgba(15,23,42,.08);text-align:left;">' +
            '<div style="font-weight:700;margin-bottom:6px;color:#0f172a;">' + title + '</div>' +
            '<div style="font-size:12px;color:#475569;margin-bottom:14px;word-break:break-word;">' + detail + '</div>' +
            '<button id="pc-boot-reset" type="button" style="background:#1e3a5f;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;">Réparer et recharger</button>' +
            '</div>';
          var btn = document.getElementById('pc-boot-reset');
          if (btn) {
            btn.onclick = function () {
              Promise.resolve()
                .then(function () {
                  if ('serviceWorker' in navigator) {
                    return navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    });
                  }
                })
                .then(function () {
                  if ('caches' in window) {
                    return caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    });
                  }
                })
                .finally(function () {
                  var sep = window.location.search ? '&' : '?';
                  var cleanSearch = window.location.search.replace(/([?&])_clean=\d+/g, '').replace(/^&/, '?');
                  var nextUrl = window.location.pathname + (cleanSearch ? cleanSearch + '&' : '?') + '_clean=' + Date.now() + window.location.hash;
                  window.location.replace(nextUrl);
                });
            };
          }
        }

        window.addEventListener(
          'error',
          function (ev) {
            if (window.__PC_BOOTED__) return;
            var msg =
              (ev && ev.message) ||
              (ev && ev.target && ev.target.src ? 'Échec chargement script : ' + ev.target.src : 'Erreur au chargement');
            showBootRecovery('Erreur de chargement au démarrage', String(msg));
          },
          true
        );

        window.addEventListener('unhandledrejection', function (ev) {
          if (window.__PC_BOOTED__) return;
          var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Erreur asynchrone au démarrage';
          showBootRecovery('Erreur de démarrage', reason);
        });

        window.setTimeout(function () {
          if (window.__PC_BOOTED__) return;
          showBootRecovery(
            'Le démarrage prend plus de temps que prévu',
            'Un cache navigateur ancien ou une connexion lente bloque le chargement. Cliquez ci-dessous pour nettoyer le cache et recharger.'
          );
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
